<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Saludador</title>
</head>

<body>
    <h1>Crear Saludador</h1>
    <label for="">nombre:</label>
    <input type="text" id="v1">
    <button onclick="crear()">Crear</button>
    <script>
        url = "http://localhost:8081/crearSaludador"
        e = document.getElementById("v1")

        function crear() {
            usuario = e.value
            console.log(usuario)

            let cuerpo = JSON.stringify({ contenido: `${usuario}` })
            console.log(cuerpo)

            fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: cuerpo
            })
                .then(async respuesta => {
                    console.log(await respuesta)
                })
                .catch()
        }

    </script>
</body>

</html>
